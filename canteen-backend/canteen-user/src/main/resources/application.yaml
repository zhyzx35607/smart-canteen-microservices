server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/canteen_user?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
# 注意：本地 Docker Redis 无密码，不要设置 spring.data.redis.password（Redisson 会把空串当作 AUTH 发送）。
# 生产环境需要密码时在此处添加：password: ${REDIS_PASSWORD:your_password}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: NOW()
      logic-not-delete-value: "NULL"

# 安全敏感配置：生产环境必须通过 Nacos 共享配置 common.yaml 或环境变量 JWT_SECRET / INTERNAL_TOKEN 覆盖。
# 这里的值仅用于本地开发/单元测试；部署前请务必替换。
jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-please-override-in-nacos-or-env-256bits}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

internal:
  token: ${INTERNAL_TOKEN:dev-only-internal-token-please-override}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{traceId}] %logger - %msg%n"
