apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: canteen
type: Opaque
stringData:
  root-password: "REPLACE_ME_DB_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: canteen
type: Opaque
stringData:
  # 部署前请替换为强随机值（至少 32 字节）；建议：openssl rand -hex 32
  jwt-secret: "REPLACE_ME_JWT_SECRET_AT_LEAST_256_BITS_LONG_RANDOM_STRING"
  internal-token: "REPLACE_ME_INTERNAL_TOKEN_RANDOM_STRING"
