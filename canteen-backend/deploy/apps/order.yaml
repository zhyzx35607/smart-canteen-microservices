apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: canteen
  labels:
    app: order-service
    tier: business
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        tier: business
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8083"
    spec:
      containers:
        - name: app
          image: registry.local/canteen/order-service:1.0.0
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: NACOS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: nacos.addr
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: mysql.host
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: mysql.port
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: mysql.user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: root-password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: redis.host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: redis.port
            - name: ROCKETMQ_NAMESRV
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: rocketmq.namesrv
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: internal-token
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: canteen
spec:
  selector:
    app: order-service
  ports:
    - port: 8083
      targetPort: 8083
