apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: canteen
  labels:
    app: gateway-service
    tier: business
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
        tier: business
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: app
          image: registry.local/canteen/gateway-service:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: NACOS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: nacos.addr
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: redis.host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: redis.port
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: canteen
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
